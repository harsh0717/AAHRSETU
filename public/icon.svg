<svg width="480" height="160" viewBox="0 0 480 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="0" y="0" width="480" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Circular Badge Motif on Left -->
  <g transform="translate(10, 8)">
    <!-- Upper Orange Arc -->
    <path d="M 72 12 A 60 60 0 0 1 132 72" stroke="#EA580C" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 12 72 A 60 60 0 0 1 72 12" stroke="#EA580C" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Lower Blue Arc -->
    <path d="M 132 72 A 60 60 0 0 1 72 132" stroke="#0F388A" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 72 132 A 60 60 0 0 1 12 72" stroke="#0F388A" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- 3 Rising Steam Waves (Orange) -->
    <path d="M 64 42 Q 67 34 64 26 Q 61 18 64 12" stroke="#EA580C" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 72 40 Q 75 32 72 24 Q 69 16 72 10" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 80 42 Q 83 34 80 26 Q 77 18 80 12" stroke="#EA580C" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cloche Food Platter (Blue) -->
    <!-- Handle -->
    <ellipse cx="72" cy="42" rx="4.5" ry="3" fill="#0F388A" />
    <!-- Dome Cover -->
    <path d="M 46 66 C 46 48 57 44 72 44 C 87 44 98 48 98 66 Z" fill="#0F388A" />
    <!-- Serving Tray Base -->
    <rect x="40" y="66" width="64" height="4.5" rx="2.2" fill="#0F388A" />

    <!-- Hand silhouette holding the platter -->
    <path d="M 22 88 C 30 78 44 76 60 76 L 96 76 C 102 76 106 78 104 82 C 102 86 94 88 88 88 L 62 88 C 52 88 42 94 30 102 Z" fill="#0F388A" />

    <!-- 3 People Icons -->
    <!-- Left Person (Blue) -->
    <circle cx="52" cy="104" r="4.5" fill="#0F388A" />
    <path d="M 44 118 C 44 112 48 111 52 111 C 56 111 60 112 60 118 Z" fill="#0F388A" />

    <!-- Center Person (Orange, taller) -->
    <circle cx="72" cy="98" r="6" fill="#EA580C" />
    <path d="M 62 118 C 62 109 66 107 72 107 C 78 107 82 109 82 118 Z" fill="#EA580C" />

    <!-- Right Person (Blue) -->
    <circle cx="92" cy="104" r="4.5" fill="#0F388A" />
    <path d="M 84 118 C 84 112 88 111 92 111 C 96 112 100 118 100 118 Z" fill="#0F388A" />
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(156, 24)">
    <!-- AAHAR in Deep Royal Blue -->
    <text x="0" y="74" fill="#0F388A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" letter-spacing="-0.03em">
      AAHAR
    </text>

    <!-- सेतु in Vibrant Orange -->
    <text x="216" y="74" fill="#EA580C" font-family="'Noto Serif Devanagari', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-weight="900" font-size="78" letter-spacing="-0.01em">
      सेतु
    </text>

    <!-- Decorative Bottom Separator with Dots -->
    <path d="M 2 96 L 90 96" stroke="#0F388A" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="100" cy="96" r="3.5" fill="#0F388A" />
    <circle cx="112" cy="96" r="6" fill="#EA580C" />
    <circle cx="124" cy="96" r="3.5" fill="#0F388A" />
    <path d="M 134 96 L 246 96" stroke="#0F388A" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
